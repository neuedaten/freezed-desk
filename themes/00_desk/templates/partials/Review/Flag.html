<f:comment>In lists: open review points of a record, and a block. Arguments: row (with review state), schema.</f:comment><f:if condition="{row.review.openPoints}"><a class="review-flag" href="/types/{schema.slug}/{row.item.id}#review" title="{desk:t(key: 'review.openPoints')}">✎ {row.review.openPoints}</a></f:if><f:if condition="{row.review.decision} == 'block'"> <span class="badge badge--review-block">{desk:t(key: 'review.state.block')}</span></f:if>
